name: Keep Supabase Alive

# Evita que Supabase (plan free) pause el proyecto por inactividad.
# Hace una petición mínima de lectura a la tabla `site_content` una vez por día.
#
# Requiere dos secrets en el repo (Settings > Secrets and variables > Actions):
#   - SUPABASE_URL       -> https://TU-PROYECTO.supabase.co
#   - SUPABASE_ANON_KEY  -> la anon/publishable key (misma que NEXT_PUBLIC_SUPABASE_ANON_KEY)
#
# Nota: los cron de GitHub Actions solo corren en la rama por defecto (main)
# y se desactivan tras 60 días sin actividad en el repo.

on:
  schedule:
    - cron: "0 6 * * *" # todos los días 06:00 UTC (03:00 Argentina)
  workflow_dispatch: {} # permite dispararlo a mano para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/site_content?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $code"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Supabase respondió con un status inesperado ($code)"
            exit 1
          fi

          echo "Ping OK — Supabase sigue activo."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
